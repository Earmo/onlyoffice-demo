map $http_x_forwarded_proto $origin_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $origin_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

map $http_host $origin_port {
    ~^\[[^\]]+\]:(?<ipv6_port>\d+)$ $ipv6_port;
    ~^[^:]+:(?<port>\d+)$ $port;
    default $server_port;
}

map $http_upgrade $proxy_connection {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # ONLYOFFICE "Download as" 的 downloadas 端点会把 cmd JSON 和 JWT tokenSession
    # 全部放在 URL query string 里，URI 可能超过 8 KB 的默认限制，导致 413。
    # 调大 client_header_buffer_size 和 large_client_header_buffers 以容纳。
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;

    root /usr/share/nginx/html;
    index index.html;

    # 这个 nginx 只负责官方前端的聚合入口，不定义 headless API 的唯一访问方式。

    # ---------- 后端 API 反向代理 ----------
    location ~ ^/api/document-runtime/[^/]+/runtime-events$ {
        set $server_upstream http://server:8080;
        proxy_pass         $server_upstream;
        proxy_http_version 1.1;
        proxy_buffering    off;
        add_header         X-Accel-Buffering no always;
        add_header         Cache-Control "no-cache" always;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Port  $origin_port;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location = /api/llm/messages/stream {
        set $server_upstream http://server:8080;
        proxy_pass         $server_upstream;
        proxy_http_version 1.1;
        proxy_buffering    off;
        add_header         X-Accel-Buffering no always;
        add_header         Cache-Control "no-cache" always;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Port  $origin_port;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location /api/ {
        set $server_upstream http://server:8080;
        proxy_pass         $server_upstream;
        proxy_http_version 1.1;
        # callback 回写可能需要等待后端下载最新文件并写入对象存储，避免默认 60s 超时过早打断。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Port  $origin_port;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # ---------- OnlyOffice 路径反向代理 ----------
    # 浏览器侧统一挂在 /api/office/ 前缀下，避免与业务根路径混在一起。
    # 例如：
    # - /api/office/web-apps/apps/api/documents/api.js
    # - /api/office/9.3.1-xxxx/doc/<docKey>/c/...
    #
    # ONLYOFFICE 9.3 自带个别插件会请求 `translations/helpers/zh-ZH.json`，
    # 但镜像内实际只提供 `zh-CN.json`。容器部署下这会在控制台产生 404，
    # 因此这里做一个同源兼容映射，避免插件资源名不一致影响页面稳定性。
    location ~ ^/api/office/(.+/sdkjs-plugins/.+/translations/helpers/)zh-ZH\.json$ {
        rewrite ^/api/office/(.+/sdkjs-plugins/.+/translations/helpers/)zh-ZH\.json$ /api/office/$1zh-CN.json last;
    }

    location /api/office/ {
        set $onlyoffice_upstream http://onlyoffice:80;
        rewrite ^/api/office/(.*)$ /$1 break;
        proxy_pass         $onlyoffice_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      $proxy_connection;
        proxy_set_header   Host            $http_host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # ONLYOFFICE 运行在子路径下时，X-Forwarded-Host 必须显式携带该前缀，
        # 否则它会按根路径推导自身运行地址，导致容器反代场景下打开文档异常。
        proxy_set_header   X-Forwarded-Host $origin_host/api/office;
        proxy_set_header   X-Forwarded-Port $origin_port;
        proxy_set_header   X-Forwarded-Proto $origin_scheme;
        # ONLYOFFICE 在子路径模式下有两类重定向：
        # 1. 已经带上 /api/office 前缀的绝对地址；
        # 2. 仍然是根路径的绝对地址。
        # 这里分别处理，避免已经正确的地址再次被补前缀，出现 /api/office/api/office/...。
        proxy_redirect     ~^https?://[^/]+(/api/office/.*)$ $scheme://$http_host$1;
        proxy_redirect     ~^https?://[^/]+(/.*)$ $scheme://$http_host/api/office$1;
        proxy_read_timeout 3600s;
        # ONLYOFFICE "Download as" 的 downloadas 端点是一个带有大体量 JWT payload 的 POST 请求，
        # 默认 1MB 限制会触发 413。设为 50m 与业务 API 路径保持一致。
        client_max_body_size 50m;
    }


    # ---------- 前端 SPA ----------
    location /onlyoffice-plugins/ {
        # 容器部署和本地直连调试都允许 ONLYOFFICE iframe 同源/跨端口加载隐藏插件资源。
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files $uri =404;
    }

    location / {
        # 单页应用路由回退，确保刷新 /editor/:id 这类路径时仍能回到前端入口。
        try_files $uri $uri/ /index.html;
    }
}
