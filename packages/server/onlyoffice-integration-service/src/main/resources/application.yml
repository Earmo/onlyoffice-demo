# 统一共享配置入口。
# 这份文件只放“所有环境都应该成立”的公共默认值，以及 profile 选择逻辑。
# 真正存在明显环境差异的内容会拆到 application-dev.yml / application-test.yml / application-prod.yml。

server:
  # Spring Boot 对外监听端口。
  port: 8080
  # 在 Nginx / Gateway / 反向代理后正确解析 X-Forwarded-* 头。
  forward-headers-strategy: framework

spring:
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
  profiles:
    # 默认开发环境走 dev；生产或测试环境通过 SPRING_PROFILES_ACTIVE 显式切换。
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      # Windows 本地断点调试本质上是“在 dev 基线上的覆盖层”。
      # 启用 windows-debug 时会自动包含 dev，这样主环境约定和本地覆盖不会互相割裂。
      windows-debug:
        - dev
  flyway:
    # 启动时自动执行数据库迁移，保证 schema 与当前代码匹配。
    enabled: true
  servlet:
    multipart:
      # 单个上传文件大小上限。
      max-file-size: 50MB
      # 单次 multipart 请求总大小上限。
      max-request-size: 50MB
  ai:
    model:
      # Phase 14.2 主 provider 走 Spring AI Alibaba DashScope。
      chat: ${SPRING_AI_CHAT_MODEL:dashscope}
    dashscope:
      # Alibaba DashScope API Key，由 Spring AI Alibaba starter 消费。
      api-key: ${LLM_PROVIDER_ALIBABA_API_KEY:}
      # DashScope 服务地址；保留可覆盖项，默认用官方域名。
      base-url: ${LLM_PROVIDER_ALIBABA_BASE_URL:https://dashscope.aliyuncs.com}
      chat:
        options:
          # 启动时默认模型；真正请求仍可通过 ChatOptions 在每次发送时覆盖。
          model: ${LLM_PROVIDER_ALIBABA_DEFAULT_MODEL:qwen-plus}

mybatis-flex:
  configuration:
    # 查询结果字段为 null 时也调用 setter，避免对象状态缺字段。
    call-setters-on-nulls: true
    # 下划线字段名自动映射到驼峰 Java 属性。
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    # 开启 OpenAPI JSON 文档。
    enabled: true

knife4j:
  # 开启 Knife4j UI。
  enable: true
  setting:
    # Knife4j 界面语言。
    language: zh_cn

onlyoffice:
  integration:
    # 浏览器或外部系统访问本服务的公开地址。
    # 开发环境通常给默认值，生产环境建议显式配置。
    public-base-url: ${ONLYOFFICE_INTEGRATION_PUBLIC_BASE_URL:}
    # ONLYOFFICE 容器访问本服务文件下载和 callback 的内部地址。
    # 具体默认值交给各环境 profile 决定，这里只保留环境变量入口。
    internal-base-url: ${ONLYOFFICE_INTEGRATION_INTERNAL_BASE_URL:}
    # 浏览器加载 ONLYOFFICE Docs 静态资源的地址。
    document-server-url: ${ONLYOFFICE_INTEGRATION_DOCUMENT_SERVER_URL:}
    # 服务端调用 ONLYOFFICE Command Service 时使用的内部地址。
    document-server-command-url: ${ONLYOFFICE_INTEGRATION_DOCUMENT_SERVER_COMMAND_URL:}
    # editor-config 签名和 callback 验签共用的 JWT 密钥。
    jwt-secret: ${ONLYOFFICE_INTEGRATION_JWT_SECRET}
    callback:
      # callback JWT 默认读取的请求头名称。
      jwt-header-name: ${ONLYOFFICE_INTEGRATION_CALLBACK_JWT_HEADER_NAME:Authorization}
    # 默认编辑语言。
    default-language: ${ONLYOFFICE_INTEGRATION_DEFAULT_LANGUAGE:zh}
    # 默认区域设置。
    default-region: ${ONLYOFFICE_INTEGRATION_DEFAULT_REGION:zh-CN}
    # 未显式传入租户时使用的默认租户。
    default-tenant-id: ${ONLYOFFICE_INTEGRATION_DEFAULT_TENANT_ID:native}
    # 未显式传入来源系统时使用的默认来源。
    default-source-system: ${ONLYOFFICE_INTEGRATION_DEFAULT_SOURCE_SYSTEM:native}
    # 未显式传入用户时使用的默认用户 ID。
    default-user: ${ONLYOFFICE_INTEGRATION_DEFAULT_USER:starter-user}
    # 未显式传入用户时使用的默认显示名。
    default-user-name: ${ONLYOFFICE_INTEGRATION_DEFAULT_USER_NAME:默认用户}
    access-context:
      # 允许参与访问上下文解析的 provider 列表。
      enabled-providers: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_ENABLED_PROVIDERS:header,jwt,default}
      # provider 实际解析顺序。
      resolution-order: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_RESOLUTION_ORDER:header,jwt,default}
      # 默认保持严格：完全没有用户上下文时直接返回 4xx。
      require-explicit-context: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_REQUIRE_EXPLICIT_CONTEXT:true}
      # 建议仅在 dev/test profile 显式开启，允许使用默认值补齐缺失字段。
      allow-default-context: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_ALLOW_DEFAULT_CONTEXT:false}
      header:
        # 是否启用基于请求头的访问上下文解析。
        enabled: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_HEADER_ENABLED:true}
        # Header provider 读取的租户请求头。
        tenant-id-header: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_HEADER_TENANT_ID:X-Tenant-Id}
        # Header provider 读取的来源系统请求头。
        source-system-header: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_HEADER_SOURCE_SYSTEM:X-Source-System}
        # Header provider 读取的外部用户 ID 请求头。
        external-user-id-header: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_HEADER_EXTERNAL_USER_ID:X-External-User-Id}
        # Header provider 读取的用户显示名请求头。
        display-name-header: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_HEADER_DISPLAY_NAME:X-User-Display-Name}
        # Header provider 读取最小权限映射的请求头。
        permissions-header: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_HEADER_PERMISSIONS:X-Access-Permissions}
      jwt:
        # 是否启用基于 JWT 的访问上下文解析。
        enabled: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_JWT_ENABLED:true}
        # JWT provider 默认读取的请求头。
        header-name: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_JWT_HEADER_NAME:Authorization}
        claim-mappings:
          # JWT 中映射租户字段的 claim 名称。
          tenant-id: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_JWT_CLAIM_TENANT_ID:tenantId}
          # JWT 中映射来源系统字段的 claim 名称。
          source-system: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_JWT_CLAIM_SOURCE_SYSTEM:sourceSystem}
          # JWT 中映射外部用户 ID 的 claim 名称。
          external-user-id: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_JWT_CLAIM_EXTERNAL_USER_ID:externalUserId}
          # JWT 中映射显示名的 claim 名称。
          display-name: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_JWT_CLAIM_DISPLAY_NAME:displayName}
          # JWT 中映射权限对象的 claim 名称。
          permissions: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_JWT_CLAIM_PERMISSIONS:permissions}
    storage:
      # 默认存储策略，环境 profile 会再给出更贴近场景的默认值。
      default-provider: ${ONLYOFFICE_INTEGRATION_STORAGE_DEFAULT_PROVIDER:local}
      routing:
        # 按 tenantId 细分存储策略；键为 tenantId，值为 provider 名称。
        tenants: {}
        # 按 sourceSystem 细分存储策略；键为来源系统，值为 provider 名称。
        source-systems: {}
      local:
        # local 存储策略根目录。
        root: ${ONLYOFFICE_INTEGRATION_STORAGE_LOCAL_ROOT:${ONLYOFFICE_INTEGRATION_STORAGE_ROOT:./storage}}
      minio:
        # MinIO 服务地址。
        endpoint: ${ONLYOFFICE_INTEGRATION_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
        # MinIO bucket 名称。
        bucket: ${ONLYOFFICE_INTEGRATION_STORAGE_MINIO_BUCKET:onlyoffice-documents}
        # MinIO Access Key。
        access-key: ${ONLYOFFICE_INTEGRATION_STORAGE_MINIO_ACCESS_KEY:onlyoffice}
        # MinIO Secret Key。
        secret-key: ${ONLYOFFICE_INTEGRATION_STORAGE_MINIO_SECRET_KEY:onlyoffice123}
        # 是否使用 path-style 访问。
        path-style-access: ${ONLYOFFICE_INTEGRATION_STORAGE_MINIO_PATH_STYLE_ACCESS:true}
        # 是否使用 HTTPS 访问 MinIO。
        secure: ${ONLYOFFICE_INTEGRATION_STORAGE_MINIO_SECURE:false}
    remote-resource:
      # 远程导入文档允许的最大字节数。
      max-document-bytes: ${ONLYOFFICE_INTEGRATION_REMOTE_RESOURCE_MAX_DOCUMENT_BYTES:52428800}
      # 图片代理允许的最大字节数。
      max-image-bytes: ${ONLYOFFICE_INTEGRATION_REMOTE_RESOURCE_MAX_IMAGE_BYTES:10485760}
      # 是否允许访问私网/本地地址；生产环境应保持 false。
      allow-private-address-access: ${ONLYOFFICE_INTEGRATION_REMOTE_RESOURCE_ALLOW_PRIVATE_ADDRESS_ACCESS:false}
    editing-session:
      # 活跃编辑会话的心跳超时窗口（秒）。
      active-timeout-seconds: ${ONLYOFFICE_INTEGRATION_EDITING_SESSION_ACTIVE_TIMEOUT_SECONDS:30}

llm:
  # 是否真正允许后端发起模型调用；默认关闭，避免本地环境误连真实 provider。
  enabled: ${LLM_ENABLED:true}
  # 是否向前端暴露 AI 工作台能力；可以在保留配置的前提下单独关闭功能开关。
  feature-enabled: ${LLM_FEATURE_ENABLED:true}
  # 14.2 默认 provider / model。
  default-provider: ${LLM_DEFAULT_PROVIDER:siliconflow}
  default-model: ${LLM_DEFAULT_MODEL:Qwen/Qwen3.5-397B-A17B}
  # 调用上游 provider 的超时时间，单位毫秒。
  timeout-millis: ${LLM_TIMEOUT_MILLIS:60000}
  # 前端首轮同步等待窗口；超过该时长后转入 request 轮询。
  request-sync-wait-millis: ${LLM_REQUEST_SYNC_WAIT_MILLIS:1500}
  # 默认向前端返回的最近对话轮次。
  default-visible-turns: ${LLM_DEFAULT_VISIBLE_TURNS:6}
  # 历史预算 token 上限，采用 chars_div_4 估算。
  history-budget-tokens: ${LLM_HISTORY_BUDGET_TOKENS:12000}
  # 历史 token 估算器名称；Phase 14 固定 chars_div_4。
  history-token-estimator: ${LLM_HISTORY_TOKEN_ESTIMATOR:chars_div_4}
  # 是否允许把当前标题上下文拼进 prompt。
  allow-heading-context: ${LLM_ALLOW_HEADING_CONTEXT:true}
  # 默认 system prompt。
  default-system-prompt: ${LLM_DEFAULT_SYSTEM_PROMPT:你是一个文档协作助手。请基于用户给出的选区和标题上下文，输出可直接写回文档的专业中文建议。}
  # 允许透传给前端的 provider 元数据白名单，禁止包含敏感信息或原始报文。
  provider-response-meta-allowlist:
    - provider
    - model
    - created
    - usage.promptTokens
    - usage.completionTokens
    - usage.totalTokens
  providers:
    alibaba-dashscope:
      enabled: ${LLM_PROVIDER_ALIBABA_ENABLED:true}
      label: Alibaba DashScope
      spring-ai-provider: dashscope
      base-url: ${LLM_PROVIDER_ALIBABA_BASE_URL:https://dashscope.aliyuncs.com}
      api-key: ${LLM_PROVIDER_ALIBABA_API_KEY:}
      default-model: ${LLM_PROVIDER_ALIBABA_DEFAULT_MODEL:qwen-plus}
      models:
        - ${LLM_PROVIDER_ALIBABA_DEFAULT_MODEL:qwen-plus}
      streaming-enabled: ${LLM_PROVIDER_ALIBABA_STREAMING_ENABLED:true}
      timeout-millis: ${LLM_PROVIDER_ALIBABA_TIMEOUT_MILLIS:60000}
    siliconflow:
      enabled: ${LLM_PROVIDER_SILICONFLOW_ENABLED:true}
      label: SiliconFlow
      spring-ai-provider: openai-compatible
      base-url: ${LLM_PROVIDER_SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${LLM_PROVIDER_SILICONFLOW_API_KEY:}
      default-model: ${LLM_PROVIDER_SILICONFLOW_DEFAULT_MODEL:Qwen/Qwen3.5-397B-A17B}
      models:
        - ${LLM_PROVIDER_SILICONFLOW_DEFAULT_MODEL:Qwen/Qwen3.5-397B-A17B}
      streaming-enabled: ${LLM_PROVIDER_SILICONFLOW_STREAMING_ENABLED:true}
      timeout-millis: ${LLM_PROVIDER_SILICONFLOW_TIMEOUT_MILLIS:60000}
  session:
    # 单文档最多保留多少个 AI 会话。
    max-sessions-per-document: ${LLM_SESSION_MAX_SESSIONS_PER_DOCUMENT:20}
    # 单会话最多保留多少条消息。
    max-messages-per-session: ${LLM_SESSION_MAX_MESSAGES_PER_SESSION:200}
    # 会话保留天数，供后续归档/清理使用。
    retention-days: ${LLM_SESSION_RETENTION_DAYS:30}
