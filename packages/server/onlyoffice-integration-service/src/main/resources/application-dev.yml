# 开发环境默认配置。
# 目标是让本机或轻量联调时“开箱即用”，因此会保留较友好的默认值和本地回退路径。

spring:
  datasource:
    # 本机通过映射端口访问容器内 PostgreSQL。
    url: jdbc:postgresql://localhost:15434/onlyoffice
    # PostgreSQL 用户名。
    username: onlyoffice
    # PostgreSQL 密码。
    password: onlyoffice
    # JDBC 驱动类。
    driver-class-name: org.postgresql.Driver


onlyoffice:
  integration:
    # 仅限本地开发使用的临时 JWT；生产环境必须通过环境变量覆盖。
    jwt-secret: ${ONLYOFFICE_INTEGRATION_JWT_SECRET:dev-only-secret-do-not-use-in-production}
    # 浏览器访问本机后端时使用的公开地址。
    public-base-url: http://localhost:8080
    # ONLYOFFICE 容器回调 Windows 本机后端时使用的内部地址。
    internal-base-url: http://host.docker.internal:8080
    # 浏览器加载 Docker 内 ONLYOFFICE Docs 静态资源时使用的宿主机地址。
    document-server-url: http://localhost:18080
    access-context:
      # 开发环境允许用默认值补齐缺失字段，便于本地联调。
      allow-default-context: ${ONLYOFFICE_INTEGRATION_ACCESS_CONTEXT_ALLOW_DEFAULT_CONTEXT:true}
    storage:
      # Windows 本地调试时默认直接走 MinIO，方便验证对象存储与 callback 回写。
      default-provider: minio
      routing:
        # 如需按租户切换存储策略，可在此填写 tenantId -> provider 映射。
        tenants: {}
        # 如需按来源系统切换存储策略，可在此填写 sourceSystem -> provider 映射。
        source-systems: {}
      minio:
        # 本机通过映射端口访问容器内 MinIO。
        endpoint: http://localhost:9000
        # 调试时使用的 bucket 名称。
        bucket: onlyoffice-documents
        # 调试时使用的 Access Key。
        access-key: onlyoffice
        # 调试时使用的 Secret Key。
        secret-key: onlyoffice123
        # MinIO 本地调试保持 path-style 访问。
        path-style-access: true
        # 本地调试默认不启用 HTTPS。
        secure: false
    remote-resource:
      # 开发环境默认仍禁止私网访问，避免本地联调时无意放宽 SSRF 边界。
      allow-private-address-access: ${ONLYOFFICE_INTEGRATION_REMOTE_RESOURCE_ALLOW_PRIVATE_ADDRESS_ACCESS:false}
