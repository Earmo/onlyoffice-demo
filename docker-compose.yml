services:
  # -------- Shared metadata database --------
  postgres:
    image: postgres:16-alpine
    container_name: onlyoffice-demo-postgres
    environment:
      POSTGRES_DB: onlyoffice_demo
      POSTGRES_USER: onlyoffice
      POSTGRES_PASSWORD: onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyoffice -d onlyoffice_demo"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # -------- OnlyOffice Document Server --------
  onlyoffice:
    image: onlyoffice/documentserver:9.3
    container_name: onlyoffice-demo-docs
    environment:
      JWT_SECRET: ${JWT_SECRET:-5d8fc72d49e070f303bb963f69902fe626eece4e}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # -------- Spring Boot 后端 --------
  server:
    build:
      context: ./packages/server
    container_name: onlyoffice-demo-server
    environment:
      # 官方前端聚合入口可留空，由请求头或网关入口自动推导公开地址。
      DEMO_PUBLIC_BASE_URL: ""
      # 浏览器侧的 ONLYOFFICE 地址默认跟随官方前端聚合入口。
      DEMO_ONLYOFFICE_DOCUMENT_SERVER_URL: ""
      # ONLYOFFICE 容器下载文档、插图、回调保存时走同一套 nginx 聚合入口。
      DEMO_ONLYOFFICE_INTERNAL_BASE_URL: http://web:80
      DEMO_ONLYOFFICE_JWT_SECRET: ${JWT_SECRET:-5d8fc72d49e070f303bb963f69902fe626eece4e}
      DEMO_DEFAULT_TENANT_ID: native
      DEMO_DEFAULT_SOURCE_SYSTEM: native
      DEMO_STORAGE_ROOT: /data/storage
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onlyoffice_demo
      SPRING_DATASOURCE_USERNAME: onlyoffice
      SPRING_DATASOURCE_PASSWORD: onlyoffice
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    volumes:
      - storage-data:/data/storage
    depends_on:
      onlyoffice:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -------- Official web（nginx 聚合 /api/ 与 ONLYOFFICE 路径）--------
  web:
    build:
      context: ./packages/web
    container_name: onlyoffice-demo-web
    ports:
      - "${WEB_PORT:-12333}:80"
    depends_on:
      server:
        condition: service_started
      onlyoffice:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:

